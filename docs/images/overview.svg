<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Jellyfin apps report to the Jellyfin server, which pushes every change live to Jellyfin Plus. Jellyfin Plus turns it into media players, remotes, events, sensors and actions in Home Assistant.">
  <style>
    :root {
      --bg: #ffffff; --card: #f4f5f7; --line: #d0d5dd; --text: #1d2939; --muted: #667085; --arrow: #98a2b3;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --card: #161b22; --line: #30363d; --text: #e6edf3; --muted: #8b949e; --arrow: #6e7681; }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .t { fill: var(--text); font: 600 17px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .s { fill: var(--muted); font: 400 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .w { fill: #ffffff; font: 700 19px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ws { fill: #ffffffd9; font: 400 13.5px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .a { stroke: var(--arrow); stroke-width: 2.5; fill: none; marker-end: url(#head); }
    .al { fill: var(--muted); font: 600 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; }
  </style>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aa5cc3"/>
      <stop offset="1" stop-color="#00a4dc"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#98a2b3"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="400" rx="16"/>

  <!-- Apps -->
  <rect class="card" x="24" y="40" width="190" height="320" rx="14"/>
  <text class="t" x="44" y="76">Jellyfin apps</text>
  <text class="s" x="44" y="112">📺  Apple TV</text>
  <text class="s" x="44" y="142">📱  iPhone / iPad</text>
  <text class="s" x="44" y="172">💻  Web browser</text>
  <text class="s" x="44" y="202">🤖  Android TV</text>
  <text class="s" x="44" y="320">play · pause · seek</text>
  <text class="s" x="44" y="342">report position</text>

  <!-- Server -->
  <path class="a" d="M216 200 H262"/>
  <rect class="card" x="268" y="130" width="170" height="140" rx="14"/>
  <text class="t" x="290" y="185">Jellyfin</text>
  <text class="t" x="290" y="207">server</text>
  <text class="s" x="290" y="240">your libraries,</text>
  <text class="s" x="290" y="258">users, progress</text>

  <!-- Arrow push -->
  <path class="a" d="M440 200 H502"/>
  <text class="al" x="446" y="186">LIVE</text>
  <text class="al" x="446" y="222">instant</text>

  <!-- Jellyfin Plus -->
  <rect x="508" y="120" width="170" height="160" rx="16" fill="url(#brand)"/>
  <text class="w" x="528" y="190">Jellyfin</text>
  <text class="w" x="528" y="214">Plus</text>
  <text class="ws" x="528" y="246">one entity per</text>
  <text class="ws" x="528" y="264">device, always</text>

  <!-- Arrows to HA -->
  <path class="a" d="M680 160 C705 160 705 80 728 80"/>
  <path class="a" d="M680 185 C705 185 705 160 728 160"/>
  <path class="a" d="M680 215 C705 215 705 240 728 240"/>
  <path class="a" d="M680 240 C705 240 705 320 728 320"/>

  <!-- HA side -->
  <rect class="card" x="734" y="44" width="204" height="68" rx="12"/>
  <text class="t" x="752" y="72">Media players</text>
  <text class="s" x="752" y="94">+ remotes, TV messages</text>

  <rect class="card" x="734" y="124" width="204" height="68" rx="12"/>
  <text class="t" x="752" y="152">Events</text>
  <text class="s" x="752" y="174">play, pause, credits, new</text>

  <rect class="card" x="734" y="204" width="204" height="68" rx="12"/>
  <text class="t" x="752" y="232">Sensors &amp; calendar</text>
  <text class="s" x="752" y="254">next up, streams, counts</text>

  <rect class="card" x="734" y="284" width="204" height="68" rx="12"/>
  <text class="t" x="752" y="312">Per person</text>
  <text class="s" x="752" y="334">progress, watched, next up</text>

  <text class="s" x="734" y="384">→ your automations &amp; dashboards</text>
</svg>
