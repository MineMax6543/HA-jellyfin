<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="960" height="210" role="img" aria-label="Whose progress is used: first a person picked in the People folder, else the Home Assistant user who started it, else the user logged in on the device, else the integration's account.">
  <style>
    :root { --bg: #ffffff; --card: #f4f5f7; --line: #d0d5dd; --text: #1d2939; --muted: #667085; --arrow: #98a2b3; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --card: #161b22; --line: #30363d; --text: #e6edf3; --muted: #8b949e; --arrow: #6e7681; }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .n { fill: #ffffff; font: 700 16px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .t { fill: var(--text); font: 600 16px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .s { fill: var(--muted); font: 400 13.5px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .h { fill: var(--text); font: 700 18px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .a { stroke: var(--arrow); stroke-width: 2.5; fill: none; marker-end: url(#head); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#98a2b3"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="210" rx="16"/>
  <text class="h" x="24" y="38">Whose progress, watched state and Next up? The first that applies:</text>

  <rect class="card" x="24" y="62" width="208" height="120" rx="14"/>
  <circle cx="54" cy="92" r="16" fill="#aa5cc3"/><text class="n" x="49" y="98">1</text>
  <text class="t" x="80" y="98">Picked person</text>
  <text class="s" x="40" y="130">"People" folder or</text>
  <text class="s" x="40" y="150">jellyfin_user: kai</text>

  <path class="a" d="M234 122 H254"/>
  <rect class="card" x="260" y="62" width="208" height="120" rx="14"/>
  <circle cx="290" cy="92" r="16" fill="#8b6ccc"/><text class="n" x="285" y="98">2</text>
  <text class="t" x="316" y="98">Who pressed play</text>
  <text class="s" x="276" y="130">the Home Assistant user,</text>
  <text class="s" x="276" y="150">if linked to Jellyfin</text>

  <path class="a" d="M470 122 H490"/>
  <rect class="card" x="496" y="62" width="208" height="120" rx="14"/>
  <circle cx="526" cy="92" r="16" fill="#4f8ad4"/><text class="n" x="521" y="98">3</text>
  <text class="t" x="552" y="98">The device's user</text>
  <text class="s" x="512" y="130">who is logged in on</text>
  <text class="s" x="512" y="150">that TV / phone / app</text>

  <path class="a" d="M706 122 H726"/>
  <rect class="card" x="732" y="62" width="204" height="120" rx="14"/>
  <circle cx="762" cy="92" r="16" fill="#00a4dc"/><text class="n" x="757" y="98">4</text>
  <text class="t" x="788" y="98">Integration</text>
  <text class="s" x="748" y="130">the account Jellyfin Plus</text>
  <text class="s" x="748" y="150">logs in with</text>
</svg>
