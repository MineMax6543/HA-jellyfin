send_message:
  target:
    entity:
      integration: jellyfin_plus
      domain: media_player
  fields:
    message:
      required: true
      example: "Someone is at the door"
      selector:
        text:
    title:
      example: "Doorbell"
      selector:
        text:
    timeout:
      default: 10
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: s
    pause:
      default: false
      selector:
        boolean:

mark_played:
  fields:
    item_id:
      required: true
      example: "a1b2c3d4e5f6"
      selector:
        text:
    jellyfin_user:
      example: "kai"
      selector:
        text:
    config_entry_id:
      selector:
        config_entry:
          integration: jellyfin_plus

mark_unplayed:
  fields:
    item_id:
      required: true
      example: "a1b2c3d4e5f6"
      selector:
        text:
    jellyfin_user:
      example: "kai"
      selector:
        text:
    config_entry_id:
      selector:
        config_entry:
          integration: jellyfin_plus

set_favorite:
  fields:
    item_id:
      required: true
      example: "a1b2c3d4e5f6"
      selector:
        text:
    jellyfin_user:
      example: "kai"
      selector:
        text:
    config_entry_id:
      selector:
        config_entry:
          integration: jellyfin_plus
    favorite:
      default: true
      selector:
        boolean:
